^BaseWorld:
	TerrainLighting:

World:
	LuaScript:
		Scripts: campaign.lua, preservation.lua
	MissionData:
		Briefing: Our forces have continued southward with the Overlord and Soviets in pursuit. An unknown number of enemy strongholds exist further south, and Malefic cultists have been scouted in the area as well.\n\nWe believe our best chance will be to open gateways to bypass these threats, but it will take time and resources to establish gateways from such a distance, so we will need to defend against our pursuers.\n\nNod's CABAL system had been analysing the ancient device, cross referencing its findings with data obtained from the Tacitus, prior to the device being lost. The analysis was incomplete, but significant progress had been made towards detailing the workings and potential uses of the device.\n\nKane warns that even this incomplete data would be extremely dangerous if it fell into the Overlord's hands. To this end, the data has been distributed across three data cores, each housed in a Temple of Nod at one of the three defensive positions we've established. The Overlord would need all three cores to gain access to the data.\n\nHowever, this also means all three must be preserved if we hope to complete the analysis.\n\nYour objective is to protect the temples while generating sufficient resources to allow us to open the gateways.
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: chrg226m

Player:
	PlayerResources:
		DefaultCash: 6000
	GrantPrerequisiteResourceDrainPower@ChargeGateways:
		OrderName: chargegateways
		Icon: chargegateways
		IconPalette: chromes
		ChargeInterval: 1
		ResourceDrain: 4
		Prerequisite: gatewayscharging
		Name: Charge Gateways
		AllowMultiple: false
		Description: \nToggleable: Spends resources over time to charge the 3 gateways.
		LaunchSound: gatewaycharge.aud
		InsufficientPowerSpeechNotification: InsufficientPower
		SupportPowerPaletteOrder: 0
		ActiveStatusBorderInterval: 10

WORMHOLEUNSTABLE:
	Tooltip:
		Name: Charging Gateway
	Targetable@ChargingGateway:
		TargetTypes: ChargingGateway
	-Interactable:
	Selectable:
		Bounds: 2048, 2048
		DecorationBounds: 2560, 2560
	SelectionDecorations:
	GrantChargingCondition@Charge:
		Condition: charged
		PauseOnCondition: !charge
		MinChargeForCondition: 240000
		InitialCharge: 0
		MaxCharge: 240000
		ChargeRate: 8
		DischargeRate: 0
		DischargeDelay: 1500
		ChargingColor: 00ff00
		DischargingColor: 00cc00
	GrantConditionOnPrerequisite@Charge:
		Condition: charge
		Prerequisites: gatewayscharging
	TransformOnCondition@Charged:
		IntoActor: wormholexl
		RequiresCondition: charged
	RevealsShroud:
		Range: 8c0

