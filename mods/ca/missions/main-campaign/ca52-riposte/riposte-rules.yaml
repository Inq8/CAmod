# Disable powers for AI

^ClusterMissilePower:
	NukePower@Cluster:
		Prerequisites: ~!botplayer

# AI powers

UPGC:
	ExternalCondition@Shield:
		Condition: tower-shield

^FirestormPower:
	AttackOrderPowerCA@ROCKET:
		Prerequisites: ~ai.minor.superweapons.enabled

^XODropPower:
	ParatroopersPowerCA@xodrop:
		Prerequisites: ~ai.supportpowers.enabled

