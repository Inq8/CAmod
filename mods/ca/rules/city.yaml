App1:
	Inherits: ^CivLargeBuilding
	Inherits@shape: ^3x2Shape
	HitShape:
		UseTargetableCellsOffsets: false
		TargetableOffsets: 0,0,0, 840,0,0, 840,-1024,0, 420,768,0, -840,0,0, -840,-1024,0, -840,1024,0
	Selectable:
		Priority: 0
		Bounds: 3072, 4096
	OwnerLostAction:
		Action: ChangeOwner
	Building:
		Footprint: ___ === xxx xxx
		Dimensions: 3,4
		LocalCenterOffset: 0,0,0
	GrantRandomCondition:
		Conditions: husk1, husk2, husk3
	WithDeathAnimation:
		DeathSequence: death
		UseDeathTypeSuffix: false
	SpawnActorOnDeath@1:
		Actor: App1.Husk
		RequiresCondition: husk1
	SpawnActorOnDeath@2:
		Actor: App1.Husk.2
		RequiresCondition: husk2
	SpawnActorOnDeath@3:
		Actor: App1.Husk.3
		RequiresCondition: husk3
	Targetable:
		TargetTypes: Ground, Structure, NoAutoTarget

App1.Husk:
	Inherits: ^CivLargeBuilding
	Inherits@shape: ^3x2Shape
	HitShape:
		UseTargetableCellsOffsets: false
		TargetableOffsets: 0,0,0, 840,0,0, 840,-1024,0, 420,768,0, -840,0,0, -840,-1024,0, -840,1024,0
	Selectable:
		Priority: 0
		Bounds: 3072, 4096
	OwnerLostAction:
		Action: ChangeOwner
	Building:
		Footprint: ___ xx= === xxx
		Dimensions: 3,4
		LocalCenterOffset: 0,0,0
	WithIdleOverlay@Crater:
		Image: Crater
		Sequence: idle
		IsDecoration: false
		Palette: terrain
		Offset: -1024,0,0
	Tooltip:
		Name: Destroyed Building
	RenderSprites:
		Image: app1.destroyed.1
	-Selectable:
	-Targetable:
	-Targetable@C4Plantable:
	-Targetable@TNTPlantable:
	-FireWarheadsOnDeath:
	-FireWarheadsOnDeath@CIVPANIC:
	Interactable:

App1.Husk.2:
	Inherits: App1.Husk
	RenderSprites:
		Image: app1.destroyed.2

App1.Husk.3:
	Inherits: App1.Husk
	RenderSprites:
		Image: app1.destroyed.3

App2:
	Inherits: App1

App2.Husk:
	Inherits: App1.Husk
	RenderSprites:
		Image: app2.destroyed.1

App2.Husk.2:
